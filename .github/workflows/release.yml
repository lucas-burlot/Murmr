# Builds the installers on each OS and attaches them to a draft GitHub Release.
# Triggered by pushing a version tag:  git tag v1.1.0 && git push origin v1.1.0
# Then write the release notes and publish the draft on GitHub.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release if it doesn't exist yet
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "Murmr ${GITHUB_REF_NAME#v}" --notes "Release notes coming soon."

  build:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            args: --mac
          - name: Windows
            os: windows-latest
            args: --win
          - name: Linux
            os: ubuntu-latest
            args: --linux
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # npm only installs the native whisper.cpp binary for the runner's CPU;
      # the Intel .dmg needs the x64 one as well.
      - name: Add the Intel macOS whisper.cpp binary
        if: runner.os == 'macOS'
        shell: bash
        run: npm install --no-save --force "@fugood/node-whisper-darwin-x64@$(node -p "require('@fugood/whisper.node/package.json').version")"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never

      # Only the installers: no auto-update metadata (.yml, .blockmap) in the release.
      - name: Upload installers to the release
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/Murmr-*.{dmg,exe,AppImage,deb})
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
